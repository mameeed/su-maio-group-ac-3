name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        run: docker buildx build --load -t $IMAGE .

      - name: Smoke test container
        run: |
          docker run -d --name app -p 80:80 $IMAGE
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:80/health
          curl --fail -X POST http://localhost:80/predict -H "Content-Type: application/json" \
            -d '{"age": 0.02, "sex": -0.044, "bmi": 0.06, "bp": -0.03, "s1": -0.02, "s2": 0.03, "s3": -0.02, "s4": 0.02, "s5": 0.02, "s6": -0.001}'
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:80/predict -H "Content-Type: application/json" -d '{"age": 0.02}')
          test "$code" = "422"
          docker cp app:/app/model/metrics.json metrics.json
          docker rm -f app

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # build again for both Intel/AMD and Apple M-chip computers, and push
      - name: Push image
        run: docker buildx build --platform linux/amd64,linux/arm64 -t $IMAGE --push .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} metrics.json --title ${{ github.ref_name }} --notes-file CHANGELOG.md
